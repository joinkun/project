# ステージ7 §2.3: 企業ごとに条件付きで有効になる方向制約。
# treasury_stock: 始点(t=0)で純資産合計が負(債務超過)の企業について、
# x_treasury(t) >= x_treasury(0) を課す。自己株式は nonpos(0以下)なので、
# これは「絶対値が増えない(自社株買いをしない)」ことを意味する。
# 分配可能額のない企業は会社法上、自社株買いができないため。
direction_constraints:
- name: jppfs_cor_TreasuryStock
  condition: net_assets_negative
  rule: monotone_from_start

# ステージ14 §B: 生成BSの会計的妥当性のための追加制約(射影QPに課す)。
# 既定はすべて無効(=S0=現行、基礎科目の符号のみ)。段階的に有効にして影響を測る。
plausibility_constraints:
  subtotal_nonneg: false                # 小計・総合計(Assets/流動/固定資産、Liabilities/流動/固定負債)>= 0
  net_assets_non_deterioration: false   # NetAssets(t) >= NetAssets(0)(債務超過の解消は求めないが悪化は禁止)
  capital_min_ratio: null               # α: 資本金・資本剰余金(t) >= α × 始点(0/0.5/1.0を比較)
  assets_ratio_range: null              # [下限, 上限] × 始点の総資産(例: [0.5, 2.0])
  residual_nonneg: false  # 残余科目(8個)の下限(総資産比-1e-3。S5、ステージ16で貸倒引当金追加後は緩和不要)
  retention_beta: null  # β: 有形固定資産・棚卸資産・売上債権(t) >= β×始点(0/0.3/0.5を比較、ステージ16)

# ステージ17 §C.1: 制約の2層への整理(論文向け)。layer1(会計恒等式・符号)は
# project_onto_feasible の不変条件で無効化できない。layer2は上のplausibility_constraints
# 一式の一括スイッチ(false で PlausibilityConfig() = S0 相当に強制される)。
constraint_layers:
  layer1: true
  layer2: true
