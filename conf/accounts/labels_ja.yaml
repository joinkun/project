# 貸借対照表表示用の日本語ラベル対応表(ステージ6 §4)。
#
# 要素IDから機械的に生成せず、手で書いた対応表を使う。
#
# accounts: 基礎科目名・小計/合計の element_id -> 日本語ラベル。
#   小計・合計の行は表示時に自動で「合計」を付加する
#   (例: jppfs_cor_CurrentAssets の "流動資産" -> 表示は "流動資産合計")。
# sections: 資産・負債・純資産の部の見出し。

accounts:
  # --- 資産側 基礎科目 ---
  __OTHER__jppfs_cor_Assets: 資産その他
  inventories: 棚卸資産
  receivables_trade: 売上債権
  jppfs_cor_CashAndDeposits: 現金及び預金
  jppfs_cor_OtherCA: その他流動資産
  allowance_doubtful_current: 貸倒引当金(流動)
  __OTHER__jppfs_cor_CurrentAssets: 流動資産その他
  jppfs_cor_PropertyPlantAndEquipment: 有形固定資産
  jppfs_cor_IntangibleAssets: 無形固定資産
  jppfs_cor_InvestmentsAndOtherAssets: 投資その他の資産
  allowance_doubtful_noncurrent: 貸倒引当金(固定)
  __OTHER__jppfs_cor_NoncurrentAssets: 固定資産その他

  # --- 負債側 基礎科目 ---
  short_term_loans: 短期借入金
  jppfs_cor_IncomeTaxesPayable: 未払法人税等
  jppfs_cor_OtherCL: その他流動負債
  payables_trade: 仕入債務
  accounts_payable_other: 未払金
  bonds_current: 1年内償還予定社債
  __OTHER__jppfs_cor_CurrentLiabilities: 流動負債その他
  __OTHER__jppfs_cor_Liabilities: 負債その他
  long_term_loans: 長期借入金
  bonds_noncurrent: 社債
  __OTHER__jppfs_cor_NoncurrentLiabilities: 固定負債その他

  # --- 純資産側 基礎科目 ---
  non_controlling_interests: 非支配株主持分
  __OTHER__jppfs_cor_NetAssets: 純資産その他
  jppfs_cor_RetainedEarnings: 利益剰余金
  jppfs_cor_CapitalStock: 資本金
  jppfs_cor_CapitalSurplus: 資本剰余金
  jppfs_cor_TreasuryStock: 自己株式
  __OTHER__jppfs_cor_ShareholdersEquity: 株主資本その他
  valuation_difference_securities: その他有価証券評価差額金
  __OTHER__jppfs_cor_ValuationAndTranslationAdjustments: 評価・換算差額等その他

  # --- 小計・合計(表示時に「合計」を付加) ---
  jppfs_cor_CurrentAssets: 流動資産
  jppfs_cor_NoncurrentAssets: 固定資産
  jppfs_cor_CurrentLiabilities: 流動負債
  jppfs_cor_NoncurrentLiabilities: 固定負債
  jppfs_cor_ShareholdersEquity: 株主資本
  jppfs_cor_ValuationAndTranslationAdjustments: 評価・換算差額等
  jppfs_cor_Assets: 資産
  jppfs_cor_Liabilities: 負債
  jppfs_cor_NetAssets: 純資産
  jppfs_cor_LiabilitiesAndNetAssets: 負債純資産

sections:
  assets: 資産の部
  liabilities: 負債の部
  net_assets: 純資産の部
